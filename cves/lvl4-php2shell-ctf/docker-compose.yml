services:
  # PHP-FPM — Chains A, B, C, E
  # Single worker (pm.max_children=1) ensures producer/consumer hit same worker (Chain E)
  php-fpm:
    image: php:8.2-fpm
    container_name: php2shell-fpm
    volumes:
      - ./webroot:/var/www/html
      - ./configs/php-fpm.ini:/usr/local/etc/php/php.ini
      - ./configs/www.conf:/usr/local/etc/php-fpm.d/www.conf
    environment:
      - FLAG=${FLAG:-php2shell{s3ss10n_p01s0n_t0_lf1_t0_rce}}
    security_opt: [seccomp:unconfined]
    privileged: true
    command: >
      bash -c "
        mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions &&
        echo \"$${FLAG}\" > /flag.txt && chmod 444 /flag.txt &&
        php-fpm
      "

  # Nginx reverse proxy → PHP-FPM  (port 80 — primary challenge target)
  nginx:
    image: nginx:alpine
    container_name: php2shell-nginx
    ports: ["80:80"]
    volumes:
      - ./webroot:/var/www/html
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [php-fpm]

  # Apache mod_php — Chain D (OOM)
  # Low memory_limit (32M) makes OOM easy to trigger
  apache:
    image: php:8.2-apache
    container_name: php2shell-apache
    ports: ["8080:80"]
    volumes:
      - ./webroot:/var/www/html
      - ./configs/php-apache.ini:/usr/local/etc/php/php.ini
    environment:
      - FLAG=${FLAG:-php2shell{s3ss10n_p01s0n_t0_lf1_t0_rce}}
    command: >
      bash -c "
        mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions &&
        echo \"$${FLAG}\" > /flag.txt && chmod 444 /flag.txt &&
        apache2-foreground
      "
