<!--
  ossec-agent-snippet.conf — bloques a AÑADIR al ossec.conf del agente Wazuh
  del HOST del CTF (dentro de <ossec_config>...</ossec_config>).
  Archivo: /var/ossec/etc/ossec.conf  → reiniciar: sudo systemctl restart wazuh-agent
  (si Wazuh corre todo-en-uno en el mismo host, es el mismo ossec.conf).

  AJUSTA la ruta de 'directories' a la real del host (BASE/flags y webroots).
-->

<!-- 1) Ingerir los eventos de auditd (RCE/LFI/flag-read/reverse shell) -->
<localfile>
  <log_format>audit</log_format>
  <location>/var/log/audit/audit.log</location>
</localfile>

<!-- 2) FIM en tiempo real: flags + webroots de php2shell y material Tomcat -->
<syscheck>
  <disabled>no</disabled>
  <!-- flags del host (su lectura la capta auditd; aquí vemos cambios) -->
  <directories check_all="yes" realtime="yes">/home/ctf/ctf-tarreo/flags</directories>
  <!-- webroot de php2shell: detecta sess_* y .php plantados -->
  <directories check_all="yes" realtime="yes">/home/ctf/ctf-tarreo/cves/lvl4-php2shell-ctf/webroot</directories>
  <alert_new_files>yes</alert_new_files>
</syscheck>

<!-- 3) (Opcional) logs de contenedores vía journald/docker si los reenvías -->
